<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07040e">
<meta name="format-detection" content="telephone=no">
<title>Cubemancy</title>
<style>
:root {
  --gold: #d4af37;
  --gold-l: #f4e4a6;
  --gold-d: #9a7b1a;
  --cream: #f5e6c8;
  --fire: #ff5a1f;
  --ice: #5ad4ff;
  --bolt: #4ea3ff;
  --arcane: #e056fd;
  --necro: #38eb6b;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --font-d: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --font-u: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  background: #050308;
  color: var(--cream);
  font-family: var(--font-u);
  overflow: hidden;
  position: fixed;
  inset: 0;
  touch-action: none;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.hidden { display: none !important; }
.ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
.ui > * { pointer-events: auto; }

#home {
  position: fixed; inset: 0; z-index: 3;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding: calc(18px + var(--safe-t)) 24px calc(28px + var(--safe-b));
  background: linear-gradient(180deg, rgba(7,4,14,.18) 0%, rgba(7,4,14,.08) 42%, rgba(7,4,14,.72) 100%);
}
#home.hidden { display: none !important; }
.home-hero { text-align: center; width: 100%; }
.home-hero h1 {
  font-family: var(--font-d);
  font-size: clamp(40px, 11vw, 58px);
  font-weight: 700;
  letter-spacing: .08em;
  line-height: .95;
  background: linear-gradient(180deg, #fff6d4 0%, var(--gold-l) 38%, var(--gold) 70%, var(--gold-d) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 24px rgba(212,175,55,.4));
  text-transform: uppercase;
}
.gold-rule {
  width: 140px; height: 4px; margin: 14px auto 10px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  position: relative;
}
.gold-rule::before {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 8px; height: 8px;
  transform: translate(-50%, -50%) rotate(45deg);
  background: var(--gold);
  box-shadow: 2px 2px 0 #7a5c12;
}
.home-hero .sub {
  font-family: var(--font-d);
  font-size: 15px;
  letter-spacing: .38em;
  text-transform: uppercase;
  color: #c4b5fd;
  opacity: .9;
  margin-bottom: 28px;
}
.btn {
  appearance: none; border: none; cursor: pointer;
  font-family: var(--font-d);
  font-weight: 700;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: #1a1004;
  background: linear-gradient(180deg, #f4e4a6 0%, var(--gold) 45%, #b8922a 100%);
  border-radius: 4px;
  box-shadow: 0 0 0 1px #7a5c12, 4px 4px 0 #3a2a08, 0 0 24px rgba(212,175,55,.45), inset 0 1px 0 rgba(255,255,255,.55);
}
.btn:active { transform: scale(.96) translate(2px, 2px); filter: brightness(.92); }
.btn-play {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 230px; min-height: 56px; padding: 16px 40px; font-size: 18px;
  animation: pulse-glow 2.4s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%,100%{ box-shadow: 0 0 0 1px #7a5c12, 4px 4px 0 #3a2a08, 0 0 20px rgba(212,175,55,.4), inset 0 1px 0 rgba(255,255,255,.55); }
  50%{ box-shadow: 0 0 0 1px #c9a227, 4px 4px 0 #3a2a08, 0 0 36px rgba(212,175,55,.7), inset 0 1px 0 rgba(255,255,255,.55); }
}

.tag-wrap { margin: 0 auto 18px; max-width: 260px; }
.tag-wrap label {
  display: block; font-size: 10px; letter-spacing: .22em;
  text-transform: uppercase; color: #9b8bb8; margin-bottom: 6px;
}
#tag-in {
  appearance: none; width: 100%; box-sizing: border-box;
  font-family: var(--font-d); font-size: 16px; font-weight: 700;
  letter-spacing: .14em; text-align: center; text-transform: uppercase;
  color: var(--cream);
  background: rgba(8,4,16,.72);
  border: 2px solid rgba(212,175,55,.55);
  border-radius: 10px; padding: 10px 14px;
  box-shadow: 0 4px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
  outline: none;
}
#tag-in::placeholder { color: #7a6d96; letter-spacing: .16em; }
#tag-in:focus { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 4px 0 rgba(0,0,0,.35); }
#tag-hud {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  font-family: var(--font-d); font-size: 12px; letter-spacing: .16em;
  text-transform: uppercase; color: #f4e4a6;
  text-shadow: 0 1px 0 #3a2a08, 0 0 10px rgba(212,175,55,.35);
  pointer-events: none; white-space: nowrap;
}
.home-hint {
  margin-top: 18px;
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #9b8bb8;
  text-align: center;
  line-height: 1.6;
}
.btn-play:disabled {
  opacity: .38;
  cursor: not-allowed;
  animation: none;
  filter: grayscale(.4);
  box-shadow: 0 0 0 1px #5a4410, 4px 4px 0 #2a1e08, inset 0 1px 0 rgba(255,255,255,.25);
}
.class-pick {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin: 0 auto 10px;
  flex-wrap: nowrap;
  max-width: 100%;
}
.cls-btn {
  appearance: none;
  border: 2px solid rgba(255,255,255,.22);
  background: rgba(8,4,16,.62);
  color: var(--cream);
  font-family: var(--font-d);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  width: 58px;
  min-height: 70px;
  flex: 0 0 auto;
  padding: 6px 2px;
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 0 rgba(0,0,0,.35);
}
.cls-btn .cls-dot {
  width: 18px; height: 18px; border-radius: 50%;
}
.cls-btn[data-cls="feu"] .cls-dot { background: var(--fire); box-shadow: 0 0 12px var(--fire); }
.cls-btn[data-cls="glace"] .cls-dot { background: var(--ice); box-shadow: 0 0 12px var(--ice); }
.cls-btn[data-cls="foudre"] .cls-dot { background: var(--bolt); box-shadow: 0 0 12px var(--bolt); }
.cls-btn[data-cls="arcane"] .cls-dot { background: var(--arcane); box-shadow: 0 0 12px var(--arcane); }
.cls-btn[data-cls="necro"] .cls-dot { background: var(--necro); box-shadow: 0 0 12px var(--necro); }
.cls-btn.on {
  border-color: var(--gold);
  color: #fff6d4;
  transform: translateY(-2px);
  box-shadow: 0 0 0 1px var(--gold), 0 6px 0 #3a2a08, 0 0 22px rgba(212,175,55,.45);
}
.cls-btn[data-cls="feu"].on { background: radial-gradient(circle at 35% 25%, rgba(255,90,31,.45), rgba(8,4,16,.75)); }
.cls-btn[data-cls="glace"].on { background: radial-gradient(circle at 35% 25%, rgba(90,212,255,.4), rgba(8,4,16,.75)); }
.cls-btn[data-cls="foudre"].on { background: radial-gradient(circle at 35% 25%, rgba(78,163,255,.42), rgba(8,4,16,.75)); }
.cls-btn[data-cls="arcane"].on { background: radial-gradient(circle at 35% 25%, rgba(224,86,253,.48), rgba(8,4,16,.75)); }
.cls-btn[data-cls="necro"].on { background: radial-gradient(circle at 35% 25%, rgba(56,235,107,.42), rgba(8,4,16,.75)); }
.cls-btn:active { transform: scale(.96); }

.pick-lab {
  font-family: var(--font-d);
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: #9b8bb8;
  text-align: center;
  margin: 4px 0 6px;
}
#hud {
  position: absolute;
  top: calc(8px + var(--safe-t));
  left: calc(10px + var(--safe-l));
  right: calc(10px + var(--safe-r));
  display: flex; gap: 8px; align-items: flex-start;
  pointer-events: none;
}
.stat {
  flex: 1;
  background: rgba(8,4,16,.55);
  border: 1px solid rgba(212,175,55,.28);
  border-radius: 8px;
  padding: 6px 8px 7px;
  backdrop-filter: blur(6px);
  min-width: 0;
}
.stat label {
  display: block;
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #c4b5fd;
  margin-bottom: 4px;
}
.track { height: 8px; background: rgba(255,255,255,.12); border-radius: 4px; overflow: hidden; }
.track > i { display: block; height: 100%; width: 100%; transform-origin: left center; border-radius: 4px; }
#hp-i { background: linear-gradient(90deg, #e11d48, #fb7185); }
#hun-i { background: linear-gradient(90deg, #d97706, #fbbf24); }
#man-i { background: linear-gradient(90deg, #2563eb, #67e8f9); }
#clock {
  width: 44px; flex: none;
  height: 44px;
  border-radius: 50%;
  background: rgba(8,4,16,.55);
  border: 1px solid rgba(212,175,55,.28);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
#xp-row {
  position: absolute;
  top: calc(54px + var(--safe-t));
  left: calc(10px + var(--safe-l));
  right: calc(64px + var(--safe-r));
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  background: rgba(8,4,16,.45);
  border: 1px solid rgba(212,175,55,.28);
  border-radius: 8px;
  padding: 4px 8px 5px;
  backdrop-filter: blur(6px);
}
#xp-row .track { flex: 1; height: 7px; background: rgba(255,255,255,.12); border-radius: 4px; overflow: hidden; }
#xp-row .track > i { display: block; height: 100%; width: 100%; transform-origin: left center; border-radius: 4px; }
#xp-i { background: linear-gradient(90deg, #6d28d9, #d4af37); }
#lvl-lab {
  font-family: var(--font-d);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  color: var(--gold-l);
  min-width: 2.6em;
}
#toast {
  position: absolute;
  top: calc(82px + var(--safe-t));
  left: 0; right: 0;
  text-align: center;
  pointer-events: none;
  font-family: var(--font-d);
  font-size: 16px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold-l);
  text-shadow: 0 2px 12px #000;
  opacity: 0;
  transition: opacity .35s;
}
#toast.show { opacity: 1; }

#joy-wrap {
  position: absolute;
  left: calc(18px + var(--safe-l));
  bottom: calc(22px + var(--safe-b));
  width: 128px; height: 128px;
}
#joy-base {
  width: 128px; height: 128px; border-radius: 50%;
  background: rgba(255,255,255,.08);
  border: 2px solid rgba(255,255,255,.18);
  position: relative;
}
#joy-knob {
  position: absolute; left: 50%; top: 50%;
  width: 56px; height: 56px; margin: -28px 0 0 -28px;
  border-radius: 50%;
  background: rgba(244,228,166,.85);
  box-shadow: 0 0 0 2px rgba(122,92,18,.5), 0 4px 12px rgba(0,0,0,.35);
}

#actions {
  position: absolute;
  right: calc(14px + var(--safe-r));
  bottom: calc(18px + var(--safe-b));
  display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
}
.spells { display: flex; gap: 10px; }
.abtn {
  width: 62px; height: 62px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.28);
  color: #fff;
  font-family: var(--font-d);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 0 rgba(0,0,0,.35), 0 0 16px rgba(0,0,0,.25);
  cursor: pointer;
}
.abtn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.abtn.off { opacity: .38; filter: grayscale(.4); }
#btn-sort {
  width: 84px; height: 84px;
  font-size: 13px;
  letter-spacing: .12em;
}
#btn-sort.feu, #btn-sort3.feu { background: radial-gradient(circle at 35% 30%, #ffb087, var(--fire) 55%, #9a1c00); }
#btn-sort.glace, #btn-sort3.glace { background: radial-gradient(circle at 35% 30%, #d9f7ff, var(--ice) 55%, #0e7490); }
#btn-sort.foudre, #btn-sort3.foudre { background: radial-gradient(circle at 35% 30%, #dbeafe, #4ea3ff 55%, #1e40af); }
#btn-sort.arcane, #btn-sort3.arcane { background: radial-gradient(circle at 35% 30%, #f5d0fe, #e056fd 55%, #86198f); }
#btn-sort.necro, #btn-sort3.necro { background: radial-gradient(circle at 35% 30%, #bbf7d0, #38eb6b 55%, #166534); }
#btn-sort2 { width: 62px; height: 62px; font-size: 9px; letter-spacing: .06em; background: radial-gradient(circle at 35% 30%, #d4a574, #8b5a2b 55%, #4a2c12); }
#btn-sort3 { width: 62px; height: 62px; font-size: 9px; letter-spacing: .06em; }
#btn-saut {
  width: 72px; height: 72px;
  background: radial-gradient(circle at 35% 30%, #fff, #e5e7eb 50%, #6b7280);
  color: #1a1004;
  font-size: 12px;
}
#btn-eat {
  width: 62px; height: 62px;
  background: radial-gradient(circle at 35% 30%, #fde68a, #b45309 55%, #7c2d12);
  color: #fff8e8;
  font-size: 10px;
}
#btn-frap {
  width: 72px; height: 72px;
  background: radial-gradient(circle at 35% 30%, #e8c090, #8b5a2b 55%, #4a2c12);
  color: #fff8e8;
  font-size: 11px;
  letter-spacing: .06em;
}
#hotbar {
  pointer-events: none;
  position: absolute;
  left: 50%;
  bottom: calc(22px + var(--safe-b));
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  pointer-events: none;
  z-index: 2;
}
#slot-bois, #slot-viande, #slot-vie, #slot-mana { pointer-events: auto; cursor: pointer; }
.slot {
  width: 58px; height: 62px;
  background: rgba(8,4,16,.62);
  border: 2px solid rgba(212,175,55,.5);
  border-radius: 8px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2px;
  box-shadow: 0 4px 0 rgba(0,0,0,.3), 0 0 12px rgba(0,0,0,.2);
}
.slot .ico {
  width: 22px; height: 22px;
  background: linear-gradient(180deg, #8b5a2b, #4a2c12);
  border-radius: 3px;
  box-shadow: 1px 1px 0 #2a1808, inset 0 1px 0 rgba(255,220,160,.35);
}
.slot .ico.ico-viande {
  background: linear-gradient(180deg, #e07a5a, #8b2e1a);
  box-shadow: 1px 1px 0 #3a1008, inset 0 1px 0 rgba(255,200,160,.4);
}
.slot .ico.ico-vie {
  background: linear-gradient(180deg, #f87171, #be123c);
  box-shadow: 1px 1px 0 #4a0818, inset 0 1px 0 rgba(255,200,200,.4);
}
.slot .ico.ico-mana {
  background: linear-gradient(180deg, #60a5fa, #1d4ed8);
  box-shadow: 1px 1px 0 #0a1a4a, inset 0 1px 0 rgba(180,210,255,.4);
}
.slot .lab {
  font-size: 8px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #c4b5fd;
}
.slot .cnt {
  font-family: var(--font-d);
  font-size: 14px;
  font-weight: 700;
  color: var(--gold-l);
  line-height: 1;
}

#death {
  position: fixed; inset: 0; z-index: 5;
  background: rgba(8,0,10,.72);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px;
}
#death h2 {
  font-family: var(--font-d);
  font-size: clamp(32px, 9vw, 48px);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #fecaca;
  text-shadow: 0 0 24px rgba(225,29,72,.6);
}
#lvl-pick {
  position: fixed; inset: 0; z-index: 6;
  background: rgba(8,0,10,.78);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 18px;
}
#lvl-pick.hidden { display: none; }
#lvl-pick h2 {
  font-family: var(--font-d);
  font-size: clamp(22px, 6vw, 36px);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--gold-l);
}
.draft-row {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 720px;
}
.draft-card {
  appearance: none; border: 2px solid rgba(212,175,55,.55);
  background: rgba(8,4,16,.82); color: var(--cream);
  width: 150px; min-height: 132px; padding: 14px 10px;
  font-family: var(--font-d); text-align: center; cursor: pointer;
  box-shadow: 0 6px 0 #3a2a08, 0 0 18px rgba(212,175,55,.2);
}
.draft-card:active { transform: translateY(3px); box-shadow: 0 3px 0 #3a2a08; }
.draft-card .dt {
  font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-l); margin-bottom: 8px;
}
.draft-card { position: relative; }
.draft-card .dnum {
  position: absolute; top: 6px; left: 8px;
  font-size: 12px; letter-spacing: .08em; color: var(--gold-l); opacity: .85;
}
.draft-card .dd { font-size: 11px; letter-spacing: .04em; line-height: 1.35; color: #c4b5fd; font-family: var(--font-u); }

@media (orientation: landscape) {
  #joy-wrap { width: 110px; height: 110px; bottom: calc(12px + var(--safe-b)); }
  #joy-base { width: 110px; height: 110px; }
  .abtn { width: 52px; height: 52px; font-size: 10px; }
  #btn-saut, #btn-eat {
  width: 62px; height: 62px;
  background: radial-gradient(circle at 35% 30%, #fde68a, #b45309 55%, #7c2d12);
  color: #fff8e8;
  font-size: 10px;
}
#btn-frap { width: 60px; height: 60px; }
  #btn-sort { width: 68px; height: 68px; font-size: 11px; }
  .class-pick { margin-bottom: 6px; gap: 4px; }
  .cls-btn { width: 46px; min-height: 50px; font-size: 8px; letter-spacing: .04em; gap: 4px; padding: 4px 1px; }
  .cls-btn .cls-dot { width: 10px; height: 10px; }
  .pick-lab { font-size: 9px; margin: 2px 0 4px; letter-spacing: .16em; }
  #btn-sort2, #btn-sort3 { width: 48px; height: 48px; font-size: 8px; }
  #hotbar { bottom: calc(12px + var(--safe-b)); }
  .slot { width: 50px; height: 54px; }
  .home-hero h1 { font-size: clamp(32px, 7vw, 48px); }
  #home { justify-content: center; padding-bottom: calc(16px + var(--safe-b)); }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="home">
  <div class="home-hero">
    <h1>Cubemancy</h1>
    <div class="gold-rule"></div>
    <div class="sub">Survive. Cast. Cube.</div>
    <div class="tag-wrap">
      <label for="tag-in">Ton tag</label>
      <input id="tag-in" type="text" maxlength="16" autocomplete="off" spellcheck="false" placeholder="TON TAG" />
    </div>
    <div class="class-pick" id="class-pick">
      <button type="button" class="cls-btn" data-cls="feu"><span class="cls-dot"></span>Feu</button>
      <button type="button" class="cls-btn" data-cls="glace"><span class="cls-dot"></span>Glace</button>
      <button type="button" class="cls-btn" data-cls="foudre"><span class="cls-dot"></span>Foudre</button>
      <button type="button" class="cls-btn" data-cls="arcane"><span class="cls-dot"></span>Arcane</button>
      <button type="button" class="cls-btn" data-cls="necro"><span class="cls-dot"></span>Nécro</button>
    </div>
    <button class="btn btn-play" id="btn-play" type="button" disabled>Jouer</button>
    <p class="home-hint">Choisis une classe · E pour le sort<br>Force secondaire au level up</p>
  </div>
</div>
<div id="play-ui" class="ui hidden">
  <div id="hud">
    <div id="tag-hud"></div>
    <div class="stat"><label>PV</label><div class="track"><i id="hp-i"></i></div></div>
    <div class="stat"><label>Faim</label><div class="track"><i id="hun-i"></i></div></div>
    <div class="stat"><label>Mana</label><div class="track"><i id="man-i"></i></div></div>
    <div id="clock">☀</div>
  </div>
  <div id="xp-row">
    <span id="lvl-lab">N.1</span>
    <div class="track"><i id="xp-i"></i></div>
  </div>
  <div id="toast"></div>
  <div id="hotbar">
    <div class="slot" id="slot-bois">
      <div class="ico"></div>

function drawBurnOverlays() {

function updateMobs(dt) {
  for (const m of mobs) {
    if (m.dead) continue;
    m.flash = Math.max(0, m.flash - dt);
    m.slow = Math.max(0, m.slow - dt);
    m.para = Math.max(0, m.para - dt);
    m.burn = Math.max(0, m.burn - dt);
    m.atk = Math.max(0, m.atk - dt * (m.para > 0 ? 0.28 : 1));
    m.hop += dt;
    if (m.burn > 0) {
      m.hp -= (m.maxHp || m.hp) * 0.03 * dt;
      if (Math.random() < dt * 10) burst(m.x, m.y + 0.45, m.z, 1, 0.38, 0.06, 2, 2.2);
      if (m.hp <= 0) {
        burst(m.x, m.y + 0.4, m.z, 1, 0.35, 0.08, 14, 6);
        killMob(m);
        continue;
      }
    }
    const dx = player.x - m.x, dz = player.z - m.z;
    const dist = Math.hypot(dx, dz) || 1;
    let spMul = 1;
    if (m.para > 0) spMul = 0.25;
    else if (m.slow > 0) spMul = 0.45;
    else if (m.inIce) spMul = 0.55;

    if (m.kind === "mage") continue;

    if (m.kind === "serviteur") {
      if (m.rise > 0) m.rise = Math.max(0, m.rise - dt);
      m.ttl = (m.ttl == null ? SERV_LIFE : m.ttl) - dt;
      if (m.ttl <= 0 || m.hp <= 0) {
        killServiteur(m);
        continue;
      }
      let tgt = m.target;
      if (tgt && !isPetPrey(tgt)) tgt = null;
      if (tgt) {
        const td = Math.hypot(tgt.x - m.x, tgt.z - m.z);
        if (td > 28) tgt = null;
      }
      if (!tgt) {
        let best = null, bestD = 24;
        for (let i = 0; i < mobs.length; i++) {
          const o = mobs[i];
          if (o.dead) continue;
          if (o.kind === "serviteur") continue;
          if (!(HOSTILE[o.kind] || o.kind === "chevreuil" || (o.kind === "mage" && o.pose === "aggro"))) continue;
          const dd = Math.hypot(o.x - m.x, o.z - m.z);
          if (dd < bestD) { bestD = dd; best = o; }
        }
        tgt = best;
      }
      m.target = tgt;
      const pdx = player.x - m.x, pdz = player.z - m.z;
      const pd = Math.hypot(pdx, pdz) || 1;
      if (pd > 36) {
        const ang = player.face + Math.PI;
        m.x = player.x + Math.sin(ang) * 1.5;
        m.z = player.z + Math.cos(ang) * 1.5;
        m.y = highest(m.x, m.z) + INV_VX + 0.05;
        m.vx = 0; m.vz = 0;
      }
      if (tgt) {
        const bx = tgt.x - m.x, bz = tgt.z - m.z;
        const bd = Math.hypot(bx, bz) || 1;
        m.yaw = Math.atan2(bx, bz);
        m.vx = (bx / bd) * SERV_SPD;
        m.vz = (bz / bd) * SERV_SPD;
        physics(m, 0.22, 1.15, dt);
        if (bd < 1.25 && m.atk <= 0) {
          m.atk = 0.85;
          hurtMob(tgt, servAtk(), bx / bd, bz / bd, 4);
        }
      } else if (pd > 2.5) {
        m.yaw = Math.atan2(pdx, pdz);
        m.vx = (pdx / pd) * SERV_SPD;
        m.vz = (pdz / pd) * SERV_SPD;
        physics(m, 0.22, 1.15, dt);
      } else {
        m.vx *= 0.85; m.vz *= 0.85;
        physics(m, 0.22, 1.15, dt);
      }
      continue;
    }

    if (m.kind === "chevreuil") {
      let fx = player.x, fz = player.z, fd = dist;
      for (let i = 0; i < mobs.length; i++) {
        const s = mobs[i];
        if (s.dead || s.kind !== "serviteur") continue;
        const sd = Math.hypot(m.x - s.x, m.z - s.z);
        if (sd < fd) { fd = sd; fx = s.x; fz = s.z; }
      }
      if (fd < 10) {
        const fdx = m.x - fx, fdz = m.z - fz;
        const fl = Math.hypot(fdx, fdz) || 1;
        m.yaw = Math.atan2(fdx, fdz);
        const sp = CERF_FLEE * spMul;
        m.vx = (fdx / fl) * sp;
        m.vz = (fdz / fl) * sp;
        m.grazing = false;
      } else {
        m.wander = (m.wander || 0) + dt;
        if (m.wander > (m.grazing ? 2.1 : 2.6)) {
          m.wander = 0;
          m.grazing = !m.grazing && Math.random() < 0.5;
          if (!m.grazing) m.wAng = Math.random() * Math.PI * 2;
        }
        if (m.grazing) {
          m.vx = 0; m.vz = 0;
        } else {
          const wa = m.wAng || m.yaw;
          m.yaw = wa;
          const wsp = 1.15 * spMul;
          m.vx = Math.sin(wa) * wsp;
          m.vz = Math.cos(wa) * wsp;
        }
      }
      physics(m, 0.28, 1.1, dt);
      continue;
    }

    m.yaw = Math.atan2(dx, dz);
    const sp = mobSpd(m.kind) * spMul;
    m.vx = (dx / dist) * sp;
    m.vz = (dz / dist) * sp;

    const ph = m.kind === "wolf" ? 0.9 : m.kind === "zombie" ? 1.55 : m.kind === "squelette" ? 1.6 : 0.7;

    }

function drawBoltSegs(b, after) {
  const dx = b.x1 - b.x0, dy = b.y1 - b.y0, dz = b.z1 - b.z0;

  const steps = Math.max(4, (len / (b.q ? 0.55 : 0.37)) | 0);
  const sl = Math.hypot(dx, dz) || 1;

  const or = after ? 0.25 : 0.28, og = after ? 0.48 : 0.52, ob = after ? 0.95 : 1.00;
  const glowO = after ? 0.35 : 0.55;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const side = (i % 2 ? 1 : -1) * 0.22 * (0.55 + hash(i + seed, 3));
    const yj = (hash(i + seed, 7) - 0.5) * 0.28;
    const x = b.x0 + dx * t + sx * side;
    const y = b.y0 + dy * t + yj;
    const z = b.z0 + dz * t + sz * side;
    drawCube(x, y, z, thick * 1.25, thick * 1.25, thick * 1.25, 0, or, og, ob, glowO);
    if (!after) drawCube(x, y, z, thick * 0.55, thick * 0.55, thick * 0.55, 0, 0.85, 0.95, 1.00, 1.0);
    if (!after && !b.q) drawCube(x + sx * 0.10, y + 0.05, z + sz * 0.10, thick * 0.7, thick * 0.7, thick * 0.7, 0, 0.306, 0.639, 1.00, 0.55);
  }
}

function drawFx(f) {

    const r0 = f.r0 != null ? f.r0 : 0.3;

    const s0 = f.s0 != null ? f.s0 : 0.32;
    const s1 = f.s1 != null ? f.s1 : 0.12;
    const rad = r0 + (r1 - r0) * t;
    const sz = s0 + (s1 - s0) * t;
    const cr = f.r != null ? f.r : 1.00;
    const cg = f.g != null ? f.g : 0.40;
    const cb = f.b != null ? f.b : 0.08;
    const glow = f.glow != null ? f.glow : 0.8;

  const bob = Math.sin(player.bob) * 0.05;

  for (const m of mobs) {

    if (p.r1 != null) { rr = p.r + (p.r1 - p.r) * (1 - k); gg = p.g + (p.g1 - p.g) * (1 - k); bb = p.b + (p.b1 - p.b) * (1 - k); }
    if (st === "trail") { glow = 0.45 * k; }
    else if (st === "float") glow = 0.25 * k;
    else if (st === "drip") glow = 0.20 * k;

}

function updateCamera(dt) {
  const fy = player.face;
  const backX = Math.sin(fy), backZ = Math.cos(fy);
  let dist = 8;
  let tx = player.x - backX * dist;
  let ty = player.y + 2.35 + player.pitch * 1.4;
  let tz = player.z - backZ * dist;
  if (mode === "home") {
    const t = performance.now() / 1000;
    const ang = t * 0.42;
    tx = player.x + Math.sin(ang) * 12;
    ty = player.y + 4.2;
    tz = player.z + Math.cos(ang) * 12;
  }
  for (let i = 0; i < 6; i++) {
    if (!isSolid(vox(tx), vox(ty), vox(tz))) break;
    dist *= 0.75;
    tx = player.x - backX * dist;
    ty = player.y + 2.1;
    tz = player.z - backZ * dist;
  }
  const k = mode === "home" ? 3 * dt : 1;
  camX += (tx - camX) * Math.min(1, k);
  camY += (ty - camY) * Math.min(1, k);
  camZ += (tz - camZ) * Math.min(1, k);

function update(dt) {

    if (player.hp <= 0) die();
    if (player.slow > 0) player.slow -= dt;

    punchCD = Math.max(0, punchCD - dt);
    staffCD = Math.max(0, staffCD - dt);

    if (night && !spawnedNight) { spawnMobs(); spawnedNight = true; toast("La nuit tombe"); beep(80, 0.3, 0.06, "sine"); }
    if (!night && spawnedNight) {
      spawnedNight = false;

    let mx = 0, mz = 0;

    if (keys.KeyA || keys.ArrowLeft) mx += 1;

    mx -= joy.dx;
    mz += -joy.dy;
    const ml = Math.hypot(mx, mz);

    const sp = 4.5 * (1 + (player.spdBonus || 0)) * (player.para > 0 ? 0.25 : player.slow > 0 ? 0.45 : 1);

    if (ml > 0.12) {

    if (player.y < -6) die();
    for (const pk of pickups) pk.bob += dt * 3.2;

      if (pk.burn != null) continue;

      if (pk.kind === "bois") { player.bois++; toast("+1 bois"); }
      else if (pk.kind === "potVie") {
        if ((player.potVie | 0) >= 8) continue;
        player.potVie++; toast("+1 potion vie");
      } else if (pk.kind === "potMana") {
        if ((player.potMana | 0) >= 8) continue;

}

    if (b) pickClass(b.dataset.cls, slot);
  });
}

function sanitizeTag(v) {
  v = String(v || "").replace(/[^\w\- ]/g, "").replace(/\s+/g, " ").trim();
  return v.slice(0, 16);
}
function loadTag() {
  try { return sanitizeTag(localStorage.getItem("cubemancy_tag") || ""); } catch (e) { return ""; }
}
function saveTag(v) {
  player.tag = sanitizeTag(v);
  try { localStorage.setItem("cubemancy_tag", player.tag); } catch (e) {}
  const inp = $("tag-in");
  if (inp && inp.value !== player.tag) inp.value = player.tag;
}
const tagIn = $("tag-in");
if (tagIn) {
  tagIn.value = loadTag();
  player.tag = tagIn.value;
  tagIn.addEventListener("input", () => saveTag(tagIn.value));
  tagIn.addEventListener("change", () => saveTag(tagIn.value));
  tagIn.addEventListener("keydown", (e) => { e.stopPropagation(); if (e.code === "Enter") { e.preventDefault(); tagIn.blur(); } });
  tagIn.addEventListener("keyup", (e) => { e.stopPropagation(); });
}

bindPick("class-pick", 1);

$("btn-play").addEventListener("click", () => {
  if (!player.cls) return;
  if (tagIn) saveTag(tagIn.value);
  applyClassUI();
  beep(330, 0.08, 0.04, "triangle");
  homeEl.classList.add("hidden");
  playUI.classList.remove("hidden");
  mode = "play";
  if (actx && actx.state === "suspended") actx.resume();
});
$("btn-retry").addEventListener("click", () => {
  resetPlay();
  applyClassUI();
  mode = "play";
  homeEl.classList.add("hidden");
  playUI.classList.remove("hidden");
});
$("btn-saut").addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); jump(); });
$("btn-eat").addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); eatViande(); });
const slotBois = $("slot-bois");
if (slotBois) slotBois.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); useBois(); });
const slotViande = $("slot-viande");
if (slotViande) slotViande.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); eatViande(); });
const slotVie = $("slot-vie");
if (slotVie) slotVie.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); usePotVie(); });
const slotMana = $("slot-mana");
if (slotMana) slotMana.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); usePotMana(); });
$("btn-frap").addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); staffStrike(); });
$("btn-sort").addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); if (player.cls) cast(player.cls, 1); });
$("btn-sort2").addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); staffStrike(); });
const btnSort3 = $("btn-sort3");
if (btnSort3) btnSort3.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); if (player.cls2) cast(player.cls2, 3); });

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 80));
document.addEventListener("visibilitychange", () => { lastT = performance.now(); });

try {
  initGL();
  resize();
  genWorld();
  buildWorldMesh();
  spawnPlayer();
  spawnWildlife();
  camX = player.x + 8; camY = player.y + 5; camZ = player.z + 9;
  if (/[?&]play\b/.test(location.search)) {
    if (!player.cls) pickClass("feu", 1);
    applyClassUI();
    homeEl.classList.add("hidden");
    playUI.classList.remove("hidden");
    mode = "play";
  }
  if (/[?&]night\b/.test(location.search)) gameTime = 62;
  requestAnimationFrame(loop);
} catch (err) {
  homeEl.innerHTML = "<p style='padding:24px;text-align:center'>WebGL indisponible.</p>";
}
})();
</script>
</body>
